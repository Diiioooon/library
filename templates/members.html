{% extends "base.html" %}
{% block body %}
<h2>Members Management</h2>
<a href="/members/add">Add a Member Here</a> | <a href="/">Back to Menu</a>
<p class="err">{{ error }}</p>
<table>
<tr><th>ID</th><th>Lastname</th><th>Firstname</th><th>Contact</th><th>Actions</th></tr>
{% for r in rows %}
<tr>
 <td>{{ r[0] }}</td><td>{{ r[2] }}</td><td>{{ r[1] }}</td><td>{{ r[3] }}</td>
 <td><a href="/members/edit/{{ r[0] }}">Edit</a> | <a href="/members/delete/{{ r[0] }}">Del</a></td>
</tr>
{% endfor %}
</table>
{% endblock %}
