{% extends "base.html" %}
{% block body %}
<h2>Books Management</h2>
<a href="/books/add">Add a Book Here</a> | <a href="/">Back to Menu</a>
<p class="err">{{ error }}</p>
<table>
<tr><th>ID</th><th>Title</th><th>Author</th><th>Year</th><th>Actions</th></tr>
{% for r in rows %}
<tr>
 <td>{{ r[0] }}</td><td>{{ r[1] }}</td><td>{{ r[2] }}</td><td>{{ r[3] }}</td>
 <td><a href="/books/edit/{{ r[0] }}">Edit</a> | <a href="/books/delete/{{ r[0] }}">Del</a></td>
</tr>
{% endfor %}
</table>
{% endblock %}
