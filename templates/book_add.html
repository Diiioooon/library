{% extends "base.html" %}
{% block body %}
<h2>Add Book</h2>
<p class="err">{{ error }}</p>
<form method="post">
 <label>Book ID</label><input type="number" name="bookID" required>
 <label>Title</label><input name="bookTitle" required>
 <label>Author</label><input name="bookAuthor" required>
 <label>Year Published</label><input type="number" name="bookYear">
 <p><button>Save</button> <a href="/books">Cancel</a></p>
</form>
{% endblock %}
